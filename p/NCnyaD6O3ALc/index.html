<!doctype html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>A-Anasınıfı · Penguen Fungi Okul Yolunda</title>
<style>
:root{--navy:#2a2860;--bg:#eef0f8;--ink:#24234f;--muted:#5d5c86;--wa:#1faa59;--wa-d:#178a47}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px;display:grid;gap:14px}
h1{font-size:19px;margin:4px 2px 0;color:var(--navy)}
.sub{margin:0 2px;color:var(--muted);font-size:14px}
img{width:100%;border-radius:14px;box-shadow:0 8px 24px rgba(27,26,69,.15);display:block}
button,a.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:14px;
  padding:16px;font:700 18px system-ui,sans-serif;cursor:pointer;text-decoration:none}
.wa{background:var(--wa);color:#fff;box-shadow:0 4px 0 var(--wa-d)}
.wa:active{transform:translateY(2px);box-shadow:0 2px 0 var(--wa-d)}
.alt{background:#fff;color:var(--navy);border:2px solid #d6d9ec;font-size:16px;padding:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{white-space:pre-wrap;background:#fff;border-radius:14px;padding:14px;font-size:14px;color:#333;border:1px solid #e1e3f0}
.note{font-size:13px;color:var(--muted);text-align:center;margin:0}.note:empty{display:none}
</style></head><body><main>
<h1>A-Anasınıfı · Penguen Fungi Okul Yolunda</h1><p class="sub">Düğmeye dokunun, WhatsApp'ta grubu seçip gönderin.</p>
<img id="afis" src="afis.jpg" alt="Veli bilgilendirme afişi">
<button class="wa" id="share"><svg width="24" height="24" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.3-.8-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.7 1.2 1.6 1.9 1.1.9 2 1.2 2.3 1.4.3.1.4.1.6-.1l.8-1c.2-.2.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>WhatsApp'ta paylaş</button>
<p class="note" id="note"></p>
<div class="row"><button class="alt" id="copy">Metni kopyala</button><a class="alt btn" href="afis.jpg" download="A-Anasınıfı_2026-10-16.jpg">Görseli indir</a></div>
<a class="alt btn" id="waText" href="#">Sadece metinle WhatsApp'ı aç</a>
<div class="msg" id="msg"></div>
</main><script>
const TEXT = "*Sevgili Velilerimiz,*\n\nBugün *Robotik Kodlama* dersimizde *\"Penguen Fungi Okul Yolunda\"* etkinliğini gerçekleştirdik.\n\nPenguen Fungi ile okula gitmeye hazırlandık ve çantamıza koymamız gerekenleri seçtik. Resimlerdeki ayrıntıları fark edip renk ve şekil dizilerini tamamladık.\n\n*Çocuğunuz bugün:*\n✅ Okul eşyalarını seçti\n✅ Resimlerdeki farkları buldu\n✅ Şekil dizilerini tamamladı\n\n🏠 *Evde Tekrar*\nBu akşamdan itibaren Bilişim Garajı platformuna giriş yaparak etkinliği çocuğunuzla birlikte tekrar edebilirsiniz.\n\n🔐 *Giriş Bilgileri*\n• Web adresi: lms.bilisimgaraji.com\n• Okul adı veya 5 haneli kod: 10193\n• Kullanıcı adı: Öğrencinin okul numarası\n• Şifre: 123456\n\nDesteğiniz için teşekkür ederiz.\n\n*Sezai ATALAY*\nRobotik Kodlama Öğretmeni";
const note = document.getElementById('note');
document.getElementById('msg').textContent = TEXT;
document.getElementById('waText').href = 'https://wa.me/?text=' + encodeURIComponent(TEXT);
async function copyText(){
  try { await navigator.clipboard.writeText(TEXT); note.textContent = 'Metin kopyalandı.'; }
  catch(e){ const r=document.createRange(); r.selectNodeContents(document.getElementById('msg'));
    const s=getSelection(); s.removeAllRanges(); s.addRange(r); note.textContent='Metni seçtim, Kopyala deyin.'; }
}
document.getElementById('copy').onclick = copyText;
document.getElementById('share').onclick = async () => {
  try {
    const blob = await (await fetch('afis.jpg')).blob();
    const file = new File([blob], 'A-Anasınıfı_2026-10-16.jpg', {type: 'image/jpeg'});
    if (navigator.canShare && navigator.canShare({files: [file]})) {
      await navigator.share({files: [file], text: TEXT});
      note.textContent = '';
    } else {
      await copyText();
      note.textContent = 'Bu tarayıcı görsel paylaşımını desteklemiyor. Metin kopyalandı; görseli indirip ekleyin.';
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    await copyText();
    note.textContent = 'Paylaşım açılamadı. Metin kopyalandı; görseli indirip ekleyin.';
  }
};
</script></body></html>
